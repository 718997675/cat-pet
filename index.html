/* 跨天：把昨天的相处结算成"记忆"，并悄悄改动今天的状态基线 */
function rollOverDay(){
  const today = dayKey();
  if (MEM.day === today) return;
  // 找到上一条有记录的日期（允许中间空几天）
  const keys = Object.keys(MEM.days).filter(k => k < today).sort();
  const yk = keys[keys.length - 1];
  const y = yk ? MEM.days[yk] : null;
  MEM.yesterday = y ? Object.assign({ date:yk }, y) : null;

  if (y){
    const n = S.needs[curCat];
    const gapDays = Math.max(1, Math.round((new Date(today) - new Date(yk)) / 86400000));
    // 昨天玩太多 → 今天兴致低一点；昨天没喂 → 今天更饿；隔得越久越明显
    const playTired = clamp((y.play||0) / 22, 0, .45);
    n.joy    = clamp(n.joy - playTired * Math.min(gapDays,3) * .5, .12, 1);
    n.hunger = clamp(n.hunger + (y.feed ? 0 : .22) * Math.min(gapDays,3), 0, .92);
    // 被摸过、被喂过 → 亲密度留住并小幅增长；冷落则略降
    n.bond = clamp(n.bond + ((y.pet||0) > 4 ? .05 : -.03) + ((y.feed||0) ? .03 : -.02), .05, 1);
    personaDrift('feed');
    // 昨天的平均心情进入长期画像
    if (y.moodN) MEM.persona.mood = lerp(MEM.persona.mood, (y.moodSum / y.moodN) / 100, .18);
  }
  // 只留最近 30 天，避免 localStorage 无限增长
  const recent = Object.keys(MEM.days).sort().slice(-30);
  const trimmed = {};
  recent.forEach(k => { trimmed[k] = MEM.days[k]; });
  MEM.days = trimmed;
  MEM.day = today;
  todayRec();
  logCat('day', y
    ? '新的一天。它记得昨天：玩了' + (y.play||0) + '次，吃了' + (y.feed||0) + '次，聊了' + (y.talk||0) + '句，被摸了' + (y.pet||0) + '次。今天的状态已经悄悄变了。'
    : '新的一天。昨天没有留下记录，它得重新观察你。');
}
const REDUCED = (() => {
  try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch (e) { return false; }
})();

/* 1D 平滑值噪声：无循环节，微动不会「又回到开头」 */
const LNOISE = Array.from({ length: 256 }, () => Math.random() * 2 - 1);
function noise1(x){
  const i = Math.floor(x), f = x - i;
  const a = LNOISE[((i % 256) + 256) % 256];
  const b = LNOISE[(((i + 1) % 256) + 256) % 256];
  const t = f * f * (3 - 2 * f);
  return a + (b - a) * t;
}
function spring(o, target, k, damp, dt){
  o.v += (target - o.x) * k * dt;
  o.v *= Math.max(0, 1 - damp * dt);
  o.x += o.v * dt;
}

function freshNeeds(){
  /* hunger=0 吃饱 / 1 很饿；joy=1 兴致高 / 0 玩腻了 */
  return { energy: rand(.62,.9), sleep: rand(.05,.25), curiosity: rand(.35,.7),
           bond: rand(.2,.45), hunger: rand(.08,.28), joy: rand(.62,.9) };
}
S.needs = {};
Object.keys(CATS).forEach(id => { S.needs[id] = freshNeeds(); });
S.life = {
  pose:null, poseUntil:0, action:'breathe', actUntil:0,
  lastAction:'', nextDecide:0, alertUntil:0, busyUntil:0,
  tilt:{x:0,v:0}, lift:{x:0,v:0}, squash:{x:0,v:0},
  gaze:{x:0,y:0}, sway:0, breath:0, t:0,
  tipTimer:0, visits:0, lastSeen:0, lastSave:0,
};

const IDLE_LINES = [
  '（没人理我。我接受了。）',
  '喵。（就一声，没什么意思）',
  '（看了你一眼，又移开）',
  '这个屋子，我已经巡视过三遍了。',
  '……（尾巴尖自己动了一下）',
  '（打了个很小的哈欠）',
];

/* 行为树候选：权重由需求实时决定，所以不会按固定顺序演 */
const AUTO_ACTS = [
  { id:'glance',  min:1.6, max:3.2,  pose:null,     tip:'（歪头看向别处）',       w:n => 1 + n.curiosity * 1.6 },
  { id:'ear',     min:1.2, max:2.2,  pose:'crouch', tip:'（耳朵转了一下）',       w:n => .6 + n.curiosity * 1.2 },
  { id:'stretch', min:1.8, max:2.8,  pose:'loaf',   tip:'（伸了个懒腰）',         w:n => .8 + n.energy * .9 },
  { id:'loaf',    min:7,   max:15,   pose:'loaf',   tip:'（趴下来歇会儿）',       w:n => 1 + n.sleep * 1.4 },
  { id:'belly',   min:5,   max:10,   pose:'belly',  tip:'（翻了个身，露出肚皮）', w:n => .5 + n.bond * 1.8 },
  { id:'doze',    min:10,  max:20,   pose:'loaf',   tip:'（打起盹来）',           w:n => .3 + n.sleep * 2.6 },
  { id:'meow',    min:1.4, max:2.2,  pose:'meow',   tip:null,                    w:n => .5 + n.bond * 1.2 },
  { id:'groom',   min:2.5, max:4.5,  pose:null,     tip:'（低头舔了舔爪子）',     w:n => 1.1 },
  { id:'crouch',  min:1.4, max:2.6,  pose:'crouch', tip:'（忽然盯住什么）',       w:n => .3 + n.curiosity * 1.5 + n.energy * .6 },
  { id:'beg',      min:2.0, max:3.2,  pose:'meow',   tip:null,                    w:n => .15 + n.hunger * n.hunger * 7 },
  { id:'ignore',   min:1.6, max:2.6,  pose:'loaf',   tip:'（扭过头，尾巴甩了一下）', w:n => .2 + (1 - n.joy) * (1 - n.joy) * 4 },
];

function lifeBusy(now){
  return S.petting || S.tool !== 'none' || V.on || now < S.talkUntil || S.sleeping;
}
function lifeIdle(now){
  return !lifeBusy(now) && now > S.life.busyUntil && now - S.lastTouch > 2600;
}
function interruptLife(){
  const L = S.life, now = performance.now();
  L.pose = null; L.poseUntil = 0;
  L.action = 'breathe'; L.actUntil = 0;
  L.busyUntil = now + 2200;
  L.nextDecide = now + 1100;
  hideLifeTip();
}
function lifeTipSay(text, ms){
  if (!lifeTip || !text) return;
  lifeTip.textContent = text;
  lifeTip.classList.add('on');
  clearTimeout(S.life.tipTimer);
  S.life.tipTimer = setTimeout(hideLifeTip, ms);
}
function hideLifeTip(){
  if (lifeTip) lifeTip.classList.remove('on');
  clearTimeout(S.life.tipTimer);
}
function setAutoPose(pose, now, dur){
  S.life.pose = pose;
  S.life.poseUntil = now + dur;
}
/* AI 大脑返回的动作，直接驱动同一套行为层 */
function playAutoAction(id, now){
  const L = S.life;
  const def = AUTO_ACTS.find(a => a.id === id);
  if (!def) return;
  L.action = id; L.actUntil = now + 2600; L.lastAction = id;
  if (def.pose) setAutoPose(def.pose, now, 2800);
  L.busyUntil = now + 3400;
  L.nextDecide = now + 3400;
}
function decideAuto(now, night){
  const L = S.life, n = S.needs[curCat];
  const pool = AUTO_ACTS.map(a => ({ a, w: Math.max(.05, a.w(n)) }));
  for (const p of pool){
    if (night && (p.a.id === 'doze' || p.a.id === 'loaf')) p.w *= 2.2;
    if (p.a.id === L.lastAction) p.w *= .12;
    if (S.moods[curCat] < 35 && (p.a.id === 'belly' || p.a.id === 'meow')) p.w *= .35;
  }
  let r = Math.random() * pool.reduce((s,p) => s + p.w, 0);
  let chosen = pool[0].a;
  for (const p of pool){ r -= p.w; if (r <= 0){ chosen = p.a; break; } }

  const dur = rand(chosen.min, chosen.max) * 1000;
  L.lastAction = chosen.id;
  L.action = chosen.id;
  L.actUntil = now + Math.min(dur, 3400);
  if (chosen.pose) setAutoPose(chosen.pose, now, dur);
  else { L.pose = null; L.poseUntil = 0; }

  if (chosen.tip && Math.random() < .5) lifeTipSay(chosen.tip, 2100);
  if (chosen.id === 'meow'){
    setTimeout(() => meow(rand(.9,1.12)), 120);
    if (Math.random() < .3) setTimeout(() => say(pick(IDLE_LINES), 2600), 260);
  }
  if (chosen.id === 'doze') n.sleep = clamp(n.sleep - .3, 0, 1);
  if (chosen.id === 'stretch') n.energy = clamp(n.energy - .1, 0, 1);
  if (chosen.id === 'belly' || chosen.id === 'meow') addMood(.6);
  /* 玩会消耗兴致，睡觉/趴着会慢慢回兴致；饿着的时候玩不动 */
  if (['crouch','ear','stretch','glance'].indexOf(chosen.id) >= 0)
    n.joy = clamp(n.joy - .045, 0, 1);
  if (chosen.id === 'doze' || chosen.id === 'loaf')
    n.joy = clamp(n.joy + .07, 0, 1);
  if (chosen.id === 'ignore') n.joy = clamp(n.joy + .05, 0, 1);
  if (chosen.id === 'beg'){
    setTimeout(() => meowSequence('喵——饿了，碗是空的。', 'grumpy'), 100);
    begTipShow(pick(['喵……饿了。','（盯着你，又叫了一声）','碗是空的。你看一眼。']), 2600);
    logCat('beg', CATS[curCat].name + '主动来找你要吃的：碗是空的。', 45);
    addMood(-1.2);
  }
  refreshEco();
}

/* 每帧：感知 → 状态演化 → 决策 → 连续动画参数 → 渲染 */
function stepLife(dt, now){
  const L = S.life, n = S.needs[curCat];
  L.t += dt;

  const c = stageCenter();
  const den = Math.max(1, c.r * 2.2);
  const gx = clamp((S.ptr.x - c.x) / den, -1, 1);
  const gy = clamp((S.ptr.y - c.y) / den, -1, 1);
  L.gaze.x = lerp(L.gaze.x, gx, 1 - Math.pow(.02, dt));
  L.gaze.y = lerp(L.gaze.y, gy, 1 - Math.pow(.02, dt));

  const hour = new Date().getHours();
  const night = (hour >= 23 || hour < 6) ? 1 : 0;
  const busy = lifeBusy(now);
  n.sleep     = clamp(n.sleep + dt * (.0035 + night * .004 + (S.sleeping ? -.012 : 0)), 0, 1);
  n.energy    = clamp(n.energy + dt * (S.sleeping ? .010 : busy ? -.006 : -.0012), 0, 1);
  n.curiosity = clamp(n.curiosity + dt * (busy ? -.010 : .007), 0, 1);
  n.bond      = clamp(n.bond + dt * (busy ? .006 : -.0004), 0, 1);
  /* 生态：饥饿持续累积（睡着时慢一点）；吃饱后随时间变饿 */
  n.hunger    = clamp(n.hunger + dt * (S.sleeping ? .00055 : .00105), 0, 1);
  /* 兴致：被冷落会缓慢回落，但不是无脑下降 —— 有波动，玩耍与睡觉另行调整 */
  n.joy       = clamp(n.joy + dt * (busy ? -.0018 : -.00035), 0, 1);
  /* 饿过头会真的不高兴 */
  if (n.hunger > .72) S.moods[curCat] = clamp(S.moods[curCat] - dt * .28, 0, 100);
  /* 讨食提示到期收起 */
  if (S.begUntil && now > S.begUntil) begTipHide();
  /* 状态越过明显阈值时，自动写一笔日志 */
  const lf = S._logFlags || (S._logFlags = {});
  if (n.hunger > .72 && !lf[curCat + '_hungry']){
    lf[curCat + '_hungry'] = 1;
    logCat('mood', CATS[curCat].name + '饿得不行了，开始找你要吃的。', 120);
  }
  if (n.hunger < .35) lf[curCat + '_hungry'] = 0;
  if (n.joy < .28 && !lf[curCat + '_bored']){
    lf[curCat + '_bored'] = 1;
    logCat('mood', CATS[curCat].name + '玩腻了，不太想搭理你。', 120);
  }
  if (n.joy > .6) lf[curCat + '_bored'] = 0;

  /* 指针快速晃动 → 警觉，反应是连续的 */
  if (S.ptr.speed > 34 && now > L.alertUntil && !busy && Math.random() < .3){
    L.alertUntil = now + 4200;
    L.action = 'alert'; L.actUntil = now + 1300;
    n.curiosity = clamp(n.curiosity + .18, 0, 1);
    if (Math.random() < .45) setAutoPose('crouch', now, 1500);
    lifeTipSay(pick(['（耳朵刷地竖起来）','（瞳孔忽然放大，盯住你）','（尾巴尖停住了）']), 1900);
  }

  if (now >= L.nextDecide){
    L.nextDecide = now + rand(900, 1800);
    if (lifeIdle(now) && now >= L.poseUntil) decideAuto(now, night);
  }
  if (L.pose && now >= L.poseUntil) L.pose = null;

  computeLiving(dt, now);
  renderLiving();
  jitterVideo();

  if (now - L.lastSave > 5000){ L.lastSave = now; saveLife(); }
}

function computeLiving(dt, now){
  const L = S.life, t = L.t;
  const slow = Math.sin(t * (2 * Math.PI / 3.6));
  const fast = Math.sin(t * (2 * Math.PI / 7.9) + 1.3) * .32;
  const wob  = noise1(t * .55) * .22;
  const doze = L.action === 'doze' || S.sleeping;
  const amp  = (doze ? 1.7 : 1) * (REDUCED ? .35 : 1);
  L.breath = (slow + fast + wob) * amp;
  L.sway   = (noise1(t * .17 + 40) * 1.1 + Math.sin(t * .23) * .5) * (REDUCED ? .3 : 1);

  let tiltT = 0, liftT = 0, squashT = 0;
  if (now < L.actUntil){
    if (L.action === 'glance') tiltT = 2.2;
    else if (L.action === 'groom') tiltT = -1.8;
    else if (L.action === 'alert' || L.action === 'ear' || L.action === 'crouch') liftT = 1;
    else if (L.action === 'stretch') squashT = 1;
  }
  spring(L.tilt,   tiltT,   42, 9,  dt);
  spring(L.lift,   liftT,   60, 11, dt);
  spring(L.squash, squashT, 34, 8,  dt);
}

function renderLiving(){
  const L = S.life;
  const set = document.querySelector('.cat-set.on');
  if (!set) return;
  const amp = REDUCED ? .35 : 1;
  const br = L.breath;
  const BASE = 1.012;
  const sx = BASE - br * .0032 - L.squash.x * .012;
  const sy = BASE + br * .0060 + L.squash.x * .022;
  const tx = L.gaze.x * 3.2 * amp + L.sway * 1.4;
  const ty = -br * 1.5 - L.lift.x * 3.2 + L.gaze.y * 1.6 * amp + (L.action === 'doze' ? 3 : 0);
  const rot = L.tilt.x + L.gaze.x * .55 * amp + L.sway * .18;
  set.style.transform = 'translate3d(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px,0) rotate(' +
    rot.toFixed(2) + 'deg) scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) + ')';
  stage.style.setProperty('--gx', (50 + L.gaze.x * 14).toFixed(1) + '%');
  stage.style.setProperty('--gy', (L.gaze.y * 10).toFixed(1) + '%');
}

/* 不再从头循环：到尾就跳到随机位置 + 随机速率，眨眼/呼吸的时机不再固定 */
function armVideo(v){
  if (!v || v.dataset.armed) return;
  v.dataset.armed = '1';
  v.loop = false;
  v.addEventListener('loadedmetadata', () => { try { v.playbackRate = rand(.9,1.12); } catch(e){} });
  v.addEventListener('ended', () => {
    try { v.currentTime = rand(.1, Math.min(2.6, (v.duration || 5) * .48)); v.play(); } catch(e){}
  });
}
function jitterVideo(){
  const v = (vid[curCat] || {})[S.shownPose || S.pose];
  if (!v || v.dataset.ready !== '1' || v.dataset.blocked === '1' || v.paused) return;
  const d = v.duration;
  if (!d || !isFinite(d) || d < 1) return;
  if (v.currentTime >= d - .3){
    try {
      v.currentTime = rand(.1, Math.min(2.6, d * .48));
      if (Math.random() < .5) v.playbackRate = rand(.9,1.12);
    } catch(e){}
  }
}

/* 记忆：心情、需求、来访时间都留住，隔很久回来会有不同反应 */
function loadLife(){
  try {
    const raw = localStorage.getItem(LIFE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || typeof d !== 'object') return null;
    if (d.moods) for (const id in d.moods) if (id in S.moods) S.moods[id] = clamp(+d.moods[id] || 0, 0, 100);
    if (d.needs) for (const id in d.needs) if (id in S.needs && d.needs[id]){
      for (const k in S.needs[id]) if (typeof d.needs[id][k] === 'number') S.needs[id][k] = clamp(d.needs[id][k], 0, 1);
    }
    if (d.memory){
      if (d.memory.days && typeof d.memory.days === 'object') MEM.days = d.memory.days;
      if (d.memory.persona) for (const k in MEM.persona)
        if (typeof d.memory.persona[k] === 'number') MEM.persona[k] = clamp(d.memory.persona[k], 0, 1);
      if (d.memory.day) MEM.day = d.memory.day;
    }
    return d;
  } catch(e){ return null; }
}
function saveLife(){
  try {
    localStorage.setItem(LIFE_KEY, JSON.stringify({
      moods:S.moods, needs:S.needs, lastSeen:Date.now(), visits:S.life.visits,
      memory:{ day:MEM.day, days:MEM.days, persona:MEM.persona },
    }));
  } catch(e){}
}
function initLife(){
  const mem = loadLife();
  S.life.visits = (mem && +mem.visits || 0) + 1;
  S.life.lastSeen = (mem && +mem.lastSeen) || 0;
  const away = S.life.lastSeen ? Date.now() - S.life.lastSeen : 0;
  loadCatLog();                           // 先载入日志，跨天结算才能把「昨天」记进去
  rollOverDay();                          // 跨天结算：昨天怎么对它，今天就有变化
  Object.values(vid).forEach(vs => Object.values(vs).forEach(armVideo));
  refreshMood(); refreshEco();
  S.life.busyUntil = performance.now() + 3200;
  window.__catLife = S.life;
  window.__catMem  = MEM;
  return away;
}

/* =========================================================
   主循环
   ========================================================= */
let last = performance.now();
let moteTimer = 0;

function frame(now){
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;

  /* 指针速度自然衰减：鼠标停住后就不再算"在甩" */
  S.ptr.speed *= Math.max(0, 1 - 7 * dt);

  /* ---- 行为层：感知 → 状态 → 决策 → 每帧动画参数（须在姿态判定之前） ---- */
  stepLife(dt, now);

  /* ---- 姿态 ---- */
  setPose(decidePose(now));

  /* ---- 逗猫棒弹性跟随 ---- */
  if (S.tool === 'feather'){
    S.feather.vx += (S.ptr.x - S.feather.x) * 42 * dt;
    S.feather.vy += (S.ptr.y - S.feather.y) * 42 * dt;
    S.feather.vx *= .82; S.feather.vy *= .82;
    S.feather.x += S.feather.vx * dt * 6;
    S.feather.y += S.feather.vy * dt * 6;
  }

  /* 扑击：任何工具下，只要目标离猫够近就可能扑（同一入口，冷却 1.5s） */
  if (S.tool !== 'none'){
    let go = false;
    if (S.tool === 'feather') go = S.ptr.speed > 26;
    else if (S.tool === 'laser') go = S.ptr.speed > 22 || Math.random() < dt * .9;
    else if (S.tool === 'yarn' && S.ball) go = Math.hypot(S.ball.vx, S.ball.vy) > 220 || Math.random() < dt * .6;
    if (go) tryPounce(now);
  }

  /* ---- 猫台跟随 ---- */
  {
    let tx = 0, ty = 0;
    const c = stageCenter();
    let aim = null;
    if (S.tool === 'feather') aim = S.feather;
    else if (S.tool === 'laser' && S.laser.on) aim = S.laser;
    else if (S.tool === 'yarn' && S.ball) aim = S.ball;
    if (aim){
      const dx = aim.x - c.x, dy = aim.y - c.y;
      const d = Math.hypot(dx, dy) || 1;
      const k = clamp(d / 380, 0, 1) * 26;
      tx = dx / d * k;
      ty = dy / d * k * .45;
    }
    S.follow.x = lerp(S.follow.x, tx, 1 - Math.pow(.001, dt));
    S.follow.y = lerp(S.follow.y, ty, 1 - Math.pow(.001, dt));
    stage.style.setProperty('--tx', S.follow.x.toFixed(1) + 'px');
    stage.style.setProperty('--ty', S.follow.y.toFixed(1) + 'px');
  }

  /* ---- 球 ---- */
  stepBall(dt, now);

  /* ---- 无交互 → 睡觉 ---- */
  const idle = now - S.lastTouch;
  if (!S.sleeping && idle > 45000 && S.tool === 'none' && !S.petting){
    S.sleeping = true;
    logCat('rest', CATS[curCat].name + '没人理，自己睡着了。', 60);
    say(pick(['……（睡着了，尾巴尖还在动）', 'z z z']), 3000);
  }
  if (S.sleeping && Math.random() < dt * .8){
    const c = stageCenter();
    spawn('zzz', c.x + c.r*.3, c.y - c.r*.45, { n: 1, max: 2.6, size: rand(13,19), vx: 8 });
  }

  /* ---- 心情慢降 ---- */
  if (!S.petting && S.tool === 'none' && idle > 12000){
    S.moods[curCat] = clamp(S.moods[curCat] - dt * .35, 0, 100);
    if (Math.random() < dt * .4) refreshMood();
  }

  /* ---- 画布 ---- */
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (canvas.width !== innerWidth * dpr || canvas.height !== innerHeight * dpr){
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  if (S.tool === 'yarn') drawBall();

  if (S.tool === 'feather'){
    const fx = S.feather.x, fy = S.feather.y;
    const ax = innerWidth * .92, ay = innerHeight * .96;
    ctx.save();
    ctx.strokeStyle = 'rgba(120,96,72,.3)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    const cx = lerp(ax, fx, .55) + Math.sin(now/700) * 14;
    const cy = lerp(ay, fy, .5) + 60;
    ctx.quadraticCurveTo(cx, cy, fx, fy);
    ctx.stroke();
    ctx.restore();
    // 羽毛
    ctx.save();
    ctx.translate(fx, fy);
    ctx.scale(1.32, 1.32);
    ctx.rotate(Math.sin(now/420) * .22 + Math.atan2(S.feather.vy, S.feather.vx) * .12);
    const g = ctx.createLinearGradient(0,-22, 0, 26);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.45,'#ffe6c9'); g.addColorStop(1,'#f0b583');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 26);
    ctx.bezierCurveTo(-16, 6, -13, -18, 0, -24);
    ctx.bezierCurveTo(13, -18, 16, 6, 0, 26);
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,130,90,.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,22); ctx.lineTo(0,-20); ctx.stroke();
    ctx.restore();
  }

  drawParticles(dt);
  requestAnimationFrame(frame);
}

/* =========================================================
   启动
   ========================================================= */
function boot(){
  loadRealMeows();   // 真实猫叫后台预解码，不阻塞首屏
  /* 不再无条件把 sit 图点亮：图还没到就给 opacity 会画出破图占位。
     applyPose 会在图片就绪时显示，没就绪就等 load/decode 回调自动补上。 */
  applyPose();
  const away = initLife();
  aiLoadCfg();
  aiRefreshUI();
  requestAnimationFrame(t => { last = t; frame(t); });

  // 视频就绪 → 接管对应姿态（真正"活"起来）
  Object.values(vid).forEach(vs => Object.values(vs).forEach(v => {
    /* canplay 只代表「能播」，不代表「已经有画面」。play() 刚恢复或 seek 未完成时
       视频层是透明的，此时必须让底下的照片顶着 */
    const markFrame = () => {
      if (v.dataset.frame === '1') return;
      v.dataset.frame = '1';
      applyPose();
    };
    v.addEventListener('playing', markFrame);
    v.addEventListener('timeupdate', markFrame);
    v.addEventListener('seeked', markFrame);
    if (typeof v.requestVideoFrameCallback === 'function'){
      try { v.requestVideoFrameCallback(markFrame); } catch(e){}
    }
    const mark = () => {
      if (v.dataset.ready === '1') return;
      v.dataset.ready = '1';
      applyPose();
    };
    if (v.readyState >= 3) mark();
    else {
      v.addEventListener('canplay', mark);
      v.addEventListener('loadeddata', mark);
    }
    // 手机上网络抖动很常见：加载失败要能自愈，别一次失败就永远静帧
    v.addEventListener('error', () => {
      v.dataset.ready = '';
      v.dataset.frame = '';
      applyPose();
      setTimeout(() => { try { v.load(); } catch (e) {} }, 1600);
    });
  }));

  // 6 段视频若都 preload=auto，会一起抢带宽把首屏图片拖慢好几秒。
  // 只有「当前这只猫 + 当前姿态」全量预载，其余一律只拿元数据。
  Object.entries(vid).forEach(([id, vs]) => {
    for (const k in vs){
      const active = id === curCat && k === S.pose;
      vs[k].preload = active ? 'auto' : 'metadata';
      if (active && vs[k].readyState === 0){ try { vs[k].load(); } catch(e){} }
    }
  });

  // 有些手机浏览器会直接无视 preload="auto"（省流量 / 低电量），视频根本不下载，
  // 于是 canplay 永远不来、看起来就是"不播视频"。到点还没就绪就主动拉一次流。
  setTimeout(() => {
    const v = (vid[curCat] || {})[S.pose];
    if (!v || v.dataset.ready === '1') return;
    v.preload = 'auto';
    // 一点都没下载才重新拉；已经有缓冲就只是没开播，load() 反而会把进度清零
    if (v.readyState === 0) { try { v.load(); } catch (e) {} }
    tryPlay(v);
  }, 3800);

  // 进场打个招呼：隔很久没来会有「重逢」反应
  setTimeout(() => {
    const y = MEM.yesterday;
    if (y && away > 3 * 3600 * 1000){
      /* 有昨天的记忆：开场白直接点出来，证明它真的记得 */
      let line;
      if ((y.feed||0) === 0 && S.needs[curCat].hunger > .6)
        line = '喵……你昨天一口都没喂我。先看碗。';
      else if ((y.play||0) >= 12 && S.needs[curCat].joy < .55)
        line = '（看见你，把头扭到一边）昨天玩够了。今天懒得动。';
      else if ((y.pet||0) >= 5)
        line = '（蹭过来，在你手心蹭了一下）昨天摸得挺舒服。再来。';
      else if ((y.talk||0) >= 6)
        line = '昨天你话真多。（打了个哈欠）今天再说点。';
      else
        line = '（抬眼看了看你）……你又来了。';
      say(line, 3800);
      meowSequence(line, guessEmotion(line));
      addMood(3);
    } else if (away > 6 * 3600 * 1000){
      const line = pick([
        '（听见门响，从窝里抬起头，看了你很久）……你回来了。',
        '喵——（绕着你的脚转了两圈，才想起来要矜持）',
        '（假装没在等，但尾巴已经竖起来了）',
      ]);
      say(line, 3600); meowSequence(line, 'happy');
      addMood(6);
      S.needs[curCat].bond = clamp(S.needs[curCat].bond + .12, 0, 1);
    } else {
      say(CATS[curCat].intro, 3200);
    }
    refreshEco();
  }, 700);
  // 各姿态都登记就绪监听，切换不闪白
  Object.values(imgs).forEach(set => Object.values(set).forEach(watchImg));
  // 不赌某一个事件：资源陆续到达的时点各重算一次，保证首屏一定出现猫
  [200, 700, 1500, 3000].forEach(ms => setTimeout(applyPose, ms));
  addEventListener('load', applyPose);
}
/* 不等 load：load 要等 15 张图 + 6 段视频全部下完，慢网络下好几秒
   圆形区域都是空的。脚本本就在 body 末尾，DOM 就绪即可启动。 */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

// 失焦时停掉呼噜，别在后台一直响
addEventListener('blur', () => { purrStop(); S.petting = false; });
addEventListener('pagehide', saveLife);
addEventListener('visibilitychange', () => { if (document.hidden) saveLife(); });
// 手机切后台再回来，视频会被系统暂停且不一定自己恢复
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncPlay(true); });
</script>
</body>
